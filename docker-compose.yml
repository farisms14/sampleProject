version: '3.8'

services:
  # 1. MySQL Database Service
  mysqldb:
    image: mysql:8.0
    container_name: travelmate-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: travelmate_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql # 
    networks:
      - travelmate-network

  # 2. Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelmate-backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/travelmate_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - mysqldb
    networks:
      - travelmate-network

  # 3. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travelmate-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - travelmate-network

networks:
  travelmate-network:
    driver: bridge

volumes:
  mysql-data: # 